name: Release

on:
  push:
    tags:
      - '[0-9]*'  # This branch's tags are plain semantic versions, e.g. 3.2.0 (not v-prefixed)

# Cancel any in-progress run for the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # See validation.yml: west.yml is not authoritative for the toolchain
  # version on this branch — this branch always builds against NCS v2.6.4.
  NCS_VERSION: v2.6.4

jobs:
  build-release:
    runs-on: ubuntu-24.04
    # container: does not support the `env` context (only github/inputs/matrix/needs/strategy/vars) — hardcode here.
    container: ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.6.4
    defaults:
      run:
        shell: bash
    env:
      NORD_KEY: ${{ secrets.NORD_PROJECT_KEY }}
      TERR_KEY: ${{ secrets.TERR_PROJECT_KEY }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "nRF7002DK"
            build_dir: "build_nrf7002dk"
            board: "nrf7002dk_nrf5340_cpuapp"
            cmake_args: ""
            allow_failure: false
          - name: "nRF54LM20DK + nRF7002EB2 (not actively maintained)"
            build_dir: "build_nrf54lm20dk_wifi"
            board: "nrf54lm20dk_nrf54lm20a_cpuapp"
            cmake_args: "-DSHIELD=nrf7002eb2"
            allow_failure: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app-workspace/nordic-wifi-memfault
          fetch-depth: 0

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          path: |
            app-workspace/.west
            app-workspace/nrf
            app-workspace/zephyr
            app-workspace/modules
            app-workspace/nrfxlib
            app-workspace/bootloader
          key: west-${{ env.NCS_VERSION }}-${{ hashFiles('app-workspace/nordic-wifi-memfault/west.yml') }}

      - name: Ensure west CLI is available
        run: |
          echo "PATH=$PATH"
          for c in west python3 python pip3 pip; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "$c -> $(command -v "$c")"
            else
              echo "$c -> not found"
            fi
          done

          if command -v west >/dev/null 2>&1; then
            echo "west already on PATH"
            exit 0
          fi

          echo "west not found on PATH in this toolchain image — installing via python's pip module"
          if command -v python3 >/dev/null 2>&1; then
            PY=python3
          elif command -v python >/dev/null 2>&1; then
            PY=python
          else
            echo "::error::No python interpreter found in this container — cannot install west"
            echo "Searching filesystem for west/python binaries (diagnostic):"
            find / -xdev -maxdepth 6 \( -iname 'west' -o -iname 'python3*' \) -type f 2>/dev/null | head -50
            exit 1
          fi

          "$PY" -m ensurepip --user >/dev/null 2>&1 || true
          "$PY" -m pip install --user -U west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          west --version

      - name: Prepare west workspace
        working-directory: app-workspace
        run: |
          grep -q 'base = zephyr' .west/config 2>/dev/null || \
            west init -l nordic-wifi-memfault
          west update -o=--depth=1 -n

      - name: Extract version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building release ${VERSION}"

      - name: Resolve merged hex helper
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          cat > resolve_merged_hex.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          BUILD_DIR="$1"
          MERGED="${BUILD_DIR}/merged.hex"
          if [ -f "${MERGED}" ]; then
            echo "merged.hex already exists"
            exit 0
          fi
          if [ -f "${BUILD_DIR}/merged_domains.hex" ]; then
            cp "${BUILD_DIR}/merged_domains.hex" "${MERGED}"
            echo "Using merged_domains.hex"
            exit 0
          fi
          echo "merged.hex not found — creating from component hex files"
          MCUBOOT="${BUILD_DIR}/mcuboot/zephyr/zephyr.hex"
          APP_S="${BUILD_DIR}/nordic-wifi-memfault/zephyr/zephyr.signed.hex"
          APP_P="${BUILD_DIR}/nordic-wifi-memfault/zephyr/zephyr.hex"
          CPUNET="${BUILD_DIR}/hci_ipc/zephyr/zephyr.hex"
          PARTS=""
          [ -f "${MCUBOOT}" ] && PARTS="${PARTS} ${MCUBOOT}"
          if [ -f "${APP_S}" ]; then PARTS="${PARTS} ${APP_S}"
          elif [ -f "${APP_P}" ]; then PARTS="${PARTS} ${APP_P}"
          fi
          [ -f "${CPUNET}" ] && PARTS="${PARTS} ${CPUNET}"
          if [ -n "${PARTS}" ]; then
            python3 - "${PARTS}" "${MERGED}" <<'PYEOF'
          import sys
          from intelhex import IntelHex
          parts = sys.argv[1].split()
          out = IntelHex()
          for f in parts:
              ih = IntelHex()
              ih.loadhex(f)
              out.merge(ih, overlap="replace")
          out.write_hex_file(sys.argv[2])
          print("merged.hex created from: " + " ".join(parts))
          PYEOF
          else
            echo "ERROR: no hex files found in ${BUILD_DIR}"
            find "${BUILD_DIR}" -name "*.hex" | head -20
            exit 1
          fi
          EOS
          chmod +x resolve_merged_hex.sh

      # ── nord_project build ──────────────────────────────────
      - name: Create overlay — nord_project
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          echo "CONFIG_MEMFAULT_NCS_PROJECT_KEY=\"${NORD_KEY}\"" > overlay-release-key.conf
          echo "CONFIG_MEMFAULT_NCS_FW_VERSION=\"${VER}\""      >> overlay-release-key.conf

      - name: Build ${{ matrix.config.name }} — nord_project
        continue-on-error: ${{ matrix.config.allow_failure }}
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          mkdir -p ${{ matrix.config.build_dir }}
          set -o pipefail
          west build -p -b ${{ matrix.config.board }} -d ${{ matrix.config.build_dir }} --sysbuild -- \
            ${{ matrix.config.cmake_args }} \
            -DEXTRA_CONF_FILE="overlay-release-key.conf" 2>&1 | tee ${{ matrix.config.build_dir }}/build.log

      - name: Resolve merged hex — ${{ matrix.config.name }} (nord_project)
        working-directory: app-workspace/nordic-wifi-memfault
        run: ./resolve_merged_hex.sh "${{ matrix.config.build_dir }}"

      - name: Extract memory usage — ${{ matrix.config.name }}
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          BUILD_LOG="${{ matrix.config.build_dir }}/build.log"
          if [ -f "$BUILD_LOG" ]; then
            ROM_USAGE="$(awk '/^[[:space:]]*FLASH:/ {
              n=$2+0; if (n>max_f) { max_f=n; line_f=$2 " " $3 " / " $4 " " $5 " (" $6 ")" }
            } END { print line_f }' "$BUILD_LOG")"
            RAM_USAGE="$(awk '/^[[:space:]]*RAM:/ {
              n=$2+0; if (n>max_r) { max_r=n; line_r=$2 " " $3 " / " $4 " " $5 " (" $6 ")" }
            } END { print line_r }' "$BUILD_LOG")"
          else
            ROM_USAGE=""
            RAM_USAGE=""
          fi
          : "${ROM_USAGE:=n/a}"
          : "${RAM_USAGE:=n/a}"
          printf "ROM_USAGE=%s\nRAM_USAGE=%s\n" "$ROM_USAGE" "$RAM_USAGE" > usage.txt
          echo "${{ matrix.config.name }}  ROM: $ROM_USAGE | RAM: $RAM_USAGE"

      - name: Stage nord_project artifacts — ${{ matrix.config.name }}
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          BOARD_TAG="$(echo '${{ matrix.config.board }}' | sed 's/_nrf5340_cpuapp$//; s/_nrf54lm20a_cpuapp$//')"
          mkdir -p release
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.elf \
             release/nord_project_${VER}_${BOARD_TAG}_zephyr.elf
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.signed.bin \
             release/nord_project_${VER}_${BOARD_TAG}_zephyr.signed.bin
          cp ${{ matrix.config.build_dir }}/merged.hex \
             release/nord_project_${VER}_${BOARD_TAG}_full.hex

      # ── terr_project build ──────────────────────────────────
      - name: Create overlay — terr_project
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          echo "CONFIG_MEMFAULT_NCS_PROJECT_KEY=\"${TERR_KEY}\"" > overlay-release-key.conf
          echo "CONFIG_MEMFAULT_NCS_FW_VERSION=\"${VER}\""      >> overlay-release-key.conf

      - name: Build ${{ matrix.config.name }} — terr_project
        continue-on-error: ${{ matrix.config.allow_failure }}
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          set -o pipefail
          west build -p -b ${{ matrix.config.board }} -d ${{ matrix.config.build_dir }} --sysbuild -- \
            ${{ matrix.config.cmake_args }} \
            -DEXTRA_CONF_FILE="overlay-release-key.conf" 2>&1 | tee ${{ matrix.config.build_dir }}/build.log

      - name: Resolve merged hex — ${{ matrix.config.name }} (terr_project)
        working-directory: app-workspace/nordic-wifi-memfault
        run: ./resolve_merged_hex.sh "${{ matrix.config.build_dir }}"

      - name: Stage terr_project artifacts — ${{ matrix.config.name }}
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          BOARD_TAG="$(echo '${{ matrix.config.board }}' | sed 's/_nrf5340_cpuapp$//; s/_nrf54lm20a_cpuapp$//')"
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.elf \
             release/terr_project_${VER}_${BOARD_TAG}_zephyr.elf
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.signed.bin \
             release/terr_project_${VER}_${BOARD_TAG}_zephyr.signed.bin
          cp ${{ matrix.config.build_dir }}/merged.hex \
             release/terr_project_${VER}_${BOARD_TAG}_full.hex

      - name: Upload release artifacts — ${{ matrix.config.name }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.config.build_dir }}
          path: |
            app-workspace/nordic-wifi-memfault/release/
            app-workspace/nordic-wifi-memfault/usage.txt

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Zephyr checkpatch
        run: |
          git clone --depth=1 https://github.com/zephyrproject-rtos/zephyr.git /tmp/zephyr
          chmod +x /tmp/zephyr/scripts/checkpatch.pl

      - name: Run Zephyr checkpatch
        run: |
          echo "Running Zephyr checkpatch on source files..."
          if [ -d src/ ]; then
            find src/ \( -name "*.c" -o -name "*.h" \) | while read -r file; do
              echo "Checking $file..."
              /tmp/zephyr/scripts/checkpatch.pl --no-tree --file "$file" || true
            done
          fi
          echo "Checkpatch analysis completed ✓"

  create-release:
    needs: [build-release, static-analysis]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/
          merge-multiple: true

      - name: Generate release notes
        id: release-notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "First release — no previous tag found"
            echo "Initial release of nordic-wifi-memfault (ncs264 branch)" > /tmp/changelog.txt
          else
            echo "Generating changelog from $PREV_TAG to ${{ steps.ver.outputs.VERSION }}"
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD > /tmp/changelog.txt
          fi

      - name: Prepare release body
        run: |
          read_usage() {
            grep "^${2}=" "release/usage.txt" 2>/dev/null | cut -d= -f2- || echo "n/a"
          }
          VER="${{ steps.ver.outputs.VERSION }}"

          cat > /tmp/release-body.txt <<EOF
          ## nordic-wifi-memfault Release ${VER}

          > Built with NCS ${{ env.NCS_VERSION }} on the \`ncs264\` branch. Project focus is nRF7002DK; nRF54LM20DK + nRF7002EB II artifacts are best-effort (not actively maintained).

          ### Firmware Files

          Each Memfault project (\`nord_project\`, \`terr_project\`) ships **6 files** across two hardware targets.

          | File suffix | Purpose | How to use |
          |---|---|---|
          | \`*_nrf7002dk_zephyr.elf\` | Debug symbol file | Upload to **Memfault → Fleet → Symbol Files** to decode stack traces and coredumps |
          | \`*_nrf7002dk_zephyr.signed.bin\` | OTA update image | Upload to **Memfault → Software → OTA Releases** to deploy over-the-air via MCUboot |
          | \`*_nrf7002dk_full.hex\` | Full board image (CPUAPP + CPUNET) | \`nrfutil device program --firmware *_nrf7002dk_full.hex --core All --erase-all\` |
          | \`*_nrf54lm20dk_zephyr.elf\` | Debug symbol file (best-effort board) | Upload to **Memfault → Fleet → Symbol Files** |
          | \`*_nrf54lm20dk_zephyr.signed.bin\` | OTA update image (best-effort board) | Upload to **Memfault → Software → OTA Releases** |
          | \`*_nrf54lm20dk_full.hex\` | Full board image (best-effort board) | \`nrfutil device program --firmware *_nrf54lm20dk_full.hex --recover\` |

          > \`nord_project\` artifacts are built with the Memfault project key for the Nord project.
          > \`terr_project\` artifacts are built with the Memfault project key for the Terr project.

          See the [Evaluator Quick Start](https://github.com/chshzh/nordic-wifi-memfault/blob/ncs264/README.md#evaluator-quick-start) for flashing and provisioning steps.

          ### Changes Since Last Release

          EOF
          cat /tmp/changelog.txt >> /tmp/release-body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "nordic-wifi-memfault ${{ steps.ver.outputs.VERSION }} (ncs264)"
          tag_name: ${{ steps.ver.outputs.VERSION }}
          body_path: /tmp/release-body.txt
          generate_release_notes: false
          files: |
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_zephyr.elf
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_zephyr.signed.bin
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_full.hex
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_zephyr.elf
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_zephyr.signed.bin
            release/nord_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_full.hex
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_zephyr.elf
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_zephyr.signed.bin
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf7002dk_full.hex
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_zephyr.elf
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_zephyr.signed.bin
            release/terr_project_${{ steps.ver.outputs.VERSION }}_nrf54lm20dk_full.hex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
