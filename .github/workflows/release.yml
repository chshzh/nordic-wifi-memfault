name: Release

on:
  push:
    tags:
      - '[0-9]*'   # legacy plain semantic versions, e.g. 3.2.0
      - 'v[0-9]*'  # v-prefixed NCS-version-aligned tags, e.g. v2.6.4.0 (matches main branch convention)

# Cancel any in-progress run for the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # See validation.yml: west.yml correctly pins sdk-nrf to v2.6.4 on this
  # branch.
  NCS_VERSION: v2.6.4
  # Zephyr SDK version bundled with NCS v2.6.4 (confirmed from a local
  # v2.6.4 toolchain install: opt/zephyr-sdk/sdk_version). The
  # ghcr.io/nrfconnect/sdk-nrf-toolchain:v2.6.4 container image is missing
  # west/python entirely (a known packaging defect around this tag — see
  # the v2.6.4-NCSDK-34113 follow-up tags on ghcr.io), so this workflow
  # installs the toolchain directly on the runner instead of using that
  # container.
  ZEPHYR_SDK_VERSION: "0.16.5"

jobs:
  build-release:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      NORD_KEY: ${{ secrets.NORD_PROJECT_KEY }}
      # Note: this branch does not build terr_project. That build requires
      # TERR_PROJECT_KEY, which intentionally lives only in the private
      # nordic-wifi-memfault-terraforma repo's secrets (never in this public
      # repo). See that repo's README for the Terraforma release flow.
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "nRF7002DK"
            build_dir: "build_nrf7002dk"
            board: "nrf7002dk_nrf5340_cpuapp"
            cmake_args: ""
            artifact_suffix: "nrf7002dk"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: app-workspace/nordic-wifi-memfault
          fetch-depth: 0

      - name: Install build dependencies (apt)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache device-tree-compiler wget \
            python3-dev python3-pip python3-setuptools python3-venv python3-wheel \
            xz-utils file make libmagic1 protobuf-compiler

      - name: Cache Zephyr SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ~/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}
          key: zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}-arm-zephyr-eabi

      - name: Install Zephyr SDK (arm-zephyr-eabi only)
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${{ env.ZEPHYR_SDK_VERSION }}/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz
          tar xf zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz -C "$HOME"
          rm zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}_linux-x86_64_minimal.tar.xz

      - name: Register Zephyr SDK CMake packages
        run: "$HOME/zephyr-sdk-${{ env.ZEPHYR_SDK_VERSION }}/setup.sh -c -t arm-zephyr-eabi"

      - name: Install west
        run: |
          pip3 install --user -U west
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache west workspace
        uses: actions/cache@v4
        with:
          path: |
            app-workspace/.west
            app-workspace/nrf
            app-workspace/zephyr
            app-workspace/modules
            app-workspace/nrfxlib
            app-workspace/bootloader
          key: west-${{ env.NCS_VERSION }}-${{ hashFiles('app-workspace/nordic-wifi-memfault/west.yml') }}

      - name: Prepare west workspace
        working-directory: app-workspace
        run: |
          grep -q 'base = zephyr' .west/config 2>/dev/null || \
            west init -l nordic-wifi-memfault
          west update -o=--depth=1 -n

      - name: Install west Python requirements
        working-directory: app-workspace
        run: |
          # Use zephyr's requirements-base.txt, NOT the full requirements.txt.
          # requirements.txt pulls in requirements-extras.txt, which installs
          # a newer protobuf/grpcio-tools that shadows the Zephyr SDK's bundled
          # nanopb generator (used by wifi_prov_over_ble/CDR modules), causing:
          #   AttributeError: module 'google.protobuf.reflection' has no attribute 'MakeClass'
          # base.txt has everything actually needed to build (pyelftools,
          # pyyaml, west, etc.) without pulling in the conflicting packages.
          pip3 install --user -r zephyr/scripts/requirements-base.txt
          if [ -f nrf/scripts/requirements.txt ]; then
            pip3 install --user -r nrf/scripts/requirements.txt
          fi
          if [ -f bootloader/mcuboot/scripts/requirements.txt ]; then
            pip3 install --user -r bootloader/mcuboot/scripts/requirements.txt
          fi
          # requirements.txt above only installs imgtool's *dependencies*
          # (cryptography, intelhex, click, cbor2) — the `imgtool` CLI itself
          # is a separate installable package (bootloader/mcuboot/scripts/setup.py,
          # console_scripts entry point "imgtool"). Without this, MCUboot image
          # signing at the end of the build fails with "imgtool: not found".
          if [ -f bootloader/mcuboot/scripts/setup.py ]; then
            pip3 install --user bootloader/mcuboot/scripts
          fi
          pip3 install --user intelhex
          # Pinned to match the version bundled with the NCS v2.6.4 toolchain
          # (confirmed compatible with the vendored nanopb generator used by
          # wifi_prov_over_ble/CDR modules) — a newer, unpinned protobuf
          # removes the 'MakeClass' API the generated _pb2.py files expect.
          pip3 install --user protobuf==4.24.3

      - name: Extract version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building release ${VERSION}"

      - name: Resolve merged hex helper
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          cat > resolve_merged_hex.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          BUILD_DIR="$1"
          FULL="${BUILD_DIR}/full.hex"

          # Case 1: sysbuild already produced a single hex covering every domain
          # (both cores + mcuboot) — some NCS versions generate this directly.
          if [ -f "${BUILD_DIR}/merged_domains.hex" ]; then
            cp "${BUILD_DIR}/merged_domains.hex" "${FULL}"
            echo "Using merged_domains.hex (already contains all domains)"
            exit 0
          fi

          # Case 2 (NCS v2.6.4 sysbuild): app core (mcuboot+app) and network
          # core (hci_ipc/BLE controller) are merged separately into
          # merged.hex and merged_CPUNET.hex. Neither alone is a full-chip
          # image — merge both into one combined hex so a single
          # `nrfutil device program --core All` flashes both cores.
          APP_MERGED="${BUILD_DIR}/merged.hex"
          NET_MERGED="${BUILD_DIR}/merged_CPUNET.hex"
          if [ -f "${APP_MERGED}" ] && [ -f "${NET_MERGED}" ]; then
            python3 - "${APP_MERGED}" "${NET_MERGED}" "${FULL}" <<'PYEOF'
          import sys
          from intelhex import IntelHex
          app_hex, net_hex, out_hex = sys.argv[1:4]
          out = IntelHex()
          for f in (app_hex, net_hex):
              ih = IntelHex()
              ih.loadhex(f)
              out.merge(ih, overlap="replace")
          out.write_hex_file(out_hex)
          print(f"full.hex created from: {app_hex} + {net_hex}")
          PYEOF
            exit 0
          fi

          # Case 3: no netcore image was built (e.g. BT disabled) — app-only
          # merged.hex is the full image for this board.
          if [ -f "${APP_MERGED}" ]; then
            cp "${APP_MERGED}" "${FULL}"
            echo "No network-core image found — using app-only merged.hex"
            exit 0
          fi

          echo "merged.hex not found — creating from component hex files"
          MCUBOOT="${BUILD_DIR}/mcuboot/zephyr/zephyr.hex"
          APP_S="${BUILD_DIR}/nordic-wifi-memfault/zephyr/zephyr.signed.hex"
          APP_P="${BUILD_DIR}/nordic-wifi-memfault/zephyr/zephyr.hex"
          CPUNET="${BUILD_DIR}/hci_ipc/zephyr/zephyr.hex"
          PARTS=""
          [ -f "${MCUBOOT}" ] && PARTS="${PARTS} ${MCUBOOT}"
          if [ -f "${APP_S}" ]; then PARTS="${PARTS} ${APP_S}"
          elif [ -f "${APP_P}" ]; then PARTS="${PARTS} ${APP_P}"
          fi
          [ -f "${CPUNET}" ] && PARTS="${PARTS} ${CPUNET}"
          if [ -n "${PARTS}" ]; then
            python3 - "${PARTS}" "${FULL}" <<'PYEOF'
          import sys
          from intelhex import IntelHex
          parts = sys.argv[1].split()
          out = IntelHex()
          for f in parts:
              ih = IntelHex()
              ih.loadhex(f)
              out.merge(ih, overlap="replace")
          out.write_hex_file(sys.argv[2])
          print("full.hex created from: " + " ".join(parts))
          PYEOF
          else
            echo "ERROR: no hex files found in ${BUILD_DIR}"
            find "${BUILD_DIR}" -name "*.hex" | head -20
            exit 1
          fi
          EOS
          chmod +x resolve_merged_hex.sh

      # ── nord_project build ──────────────────────────────────
      - name: Create overlay — nord_project
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          echo "CONFIG_MEMFAULT_NCS_PROJECT_KEY=\"${NORD_KEY}\"" > overlay-release-key.conf
          echo "CONFIG_MEMFAULT_NCS_FW_VERSION=\"${VER}\""      >> overlay-release-key.conf

      - name: Build ${{ matrix.config.name }} — nord_project
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          mkdir -p ${{ matrix.config.build_dir }}
          set -o pipefail
          west build -p -b ${{ matrix.config.board }} -d ${{ matrix.config.build_dir }} --sysbuild -- \
            ${{ matrix.config.cmake_args }} \
            -DEXTRA_CONF_FILE="overlay-release-key.conf" 2>&1 | tee ${{ matrix.config.build_dir }}/build.log

      - name: Resolve merged hex — ${{ matrix.config.name }} (nord_project)
        working-directory: app-workspace/nordic-wifi-memfault
        run: ./resolve_merged_hex.sh "${{ matrix.config.build_dir }}"

      - name: Extract memory usage — ${{ matrix.config.name }}
        working-directory: app-workspace/nordic-wifi-memfault
        run: |
          BUILD_LOG="${{ matrix.config.build_dir }}/build.log"
          if [ -f "$BUILD_LOG" ]; then
            ROM_USAGE="$(awk '/^[[:space:]]*FLASH:/ {
              n=$2+0; if (n>max_f) { max_f=n; line_f=$2 " " $3 " / " $4 " " $5 " (" $6 ")" }
            } END { print line_f }' "$BUILD_LOG")"
            RAM_USAGE="$(awk '/^[[:space:]]*RAM:/ {
              n=$2+0; if (n>max_r) { max_r=n; line_r=$2 " " $3 " / " $4 " " $5 " (" $6 ")" }
            } END { print line_r }' "$BUILD_LOG")"
          else
            ROM_USAGE=""
            RAM_USAGE=""
          fi
          : "${ROM_USAGE:=n/a}"
          : "${RAM_USAGE:=n/a}"
          printf "ROM_USAGE=%s\nRAM_USAGE=%s\n" "$ROM_USAGE" "$RAM_USAGE" > usage.txt
          echo "${{ matrix.config.name }}  ROM: $ROM_USAGE | RAM: $RAM_USAGE"

      - name: Stage artifacts — ${{ matrix.config.name }}
        working-directory: app-workspace/nordic-wifi-memfault
        env:
          VER: ${{ steps.ver.outputs.VERSION }}
        run: |
          STAGE="stage-${{ matrix.config.artifact_suffix }}"
          mkdir -p "$STAGE"
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.elf \
             "$STAGE/nordic-wifi-memfault-${{ matrix.config.artifact_suffix }}-nord-project-${VER}.elf"
          cp ${{ matrix.config.build_dir }}/nordic-wifi-memfault/zephyr/zephyr.signed.bin \
             "$STAGE/nordic-wifi-memfault-${{ matrix.config.artifact_suffix }}-nord-project-${VER}.signed.bin"
          cp ${{ matrix.config.build_dir }}/full.hex \
             "$STAGE/nordic-wifi-memfault-${{ matrix.config.artifact_suffix }}-nord-project-${VER}.hex"
          cp usage.txt "$STAGE/usage.txt"

      - name: Upload release artifacts — ${{ matrix.config.name }}
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.config.artifact_suffix }}
          path: app-workspace/nordic-wifi-memfault/stage-${{ matrix.config.artifact_suffix }}/

  static-analysis:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Zephyr checkpatch
        run: |
          git clone --depth=1 https://github.com/zephyrproject-rtos/zephyr.git /tmp/zephyr
          chmod +x /tmp/zephyr/scripts/checkpatch.pl

      - name: Run Zephyr checkpatch
        run: |
          echo "Running Zephyr checkpatch on source files..."
          if [ -d src/ ]; then
            find src/ \( -name "*.c" -o -name "*.h" \) | while read -r file; do
              echo "Checking $file..."
              /tmp/zephyr/scripts/checkpatch.pl --no-tree --file "$file" || true
            done
          fi
          echo "Checkpatch analysis completed ✓"

  create-release:
    needs: [build-release, static-analysis]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release/
          merge-multiple: false

      - name: Generate release notes
        id: release-notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "First release — no previous tag found"
            echo "Initial release of nordic-wifi-memfault (ncs264 branch)" > /tmp/changelog.txt
          else
            echo "Generating changelog from $PREV_TAG to ${{ steps.ver.outputs.VERSION }}"
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD > /tmp/changelog.txt
          fi

      - name: Prepare release body
        run: |
          read_usage() {
            local dir="$1"
            local key="$2"
            grep "^${key}=" "release/${dir}/usage.txt" 2>/dev/null | cut -d= -f2-
          }

          VER="${{ steps.ver.outputs.VERSION }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          DL_BASE="${REPO}/releases/download/${VER}"

          NRF7002DK_ROM="$(read_usage "release-nrf7002dk" ROM_USAGE)"
          NRF7002DK_RAM="$(read_usage "release-nrf7002dk" RAM_USAGE)"

          : "${NRF7002DK_ROM:=n/a}"
          : "${NRF7002DK_RAM:=n/a}"

          cat > /tmp/release-body.txt <<EOF
          ## Nordic Wi-Fi Memfault Release ${VER}

          > Built with NCS ${{ env.NCS_VERSION }} on the \`ncs264\` branch — version format is \`v<ncs-version>.<build>\` (e.g. \`v2.6.4.0\`), where the major/minor/patch matches the NCS version this firmware is based on. CI targets nRF7002DK only — nRF54LM20DK + nRF7002EB II is not actively maintained and is no longer built here.

          ### 📦 Firmware Files

          | Board | Flash image | OTA image | Symbol file | ROM Usage | RAM Usage |
          |-------|-------------|-----------|-------------|-----------|-----------|
          | nRF7002DK | [nordic-wifi-memfault-nrf7002dk-nord-project-${VER}.hex](${DL_BASE}/nordic-wifi-memfault-nrf7002dk-nord-project-${VER}.hex) | [.signed.bin](${DL_BASE}/nordic-wifi-memfault-nrf7002dk-nord-project-${VER}.signed.bin) | [.elf](${DL_BASE}/nordic-wifi-memfault-nrf7002dk-nord-project-${VER}.elf) | ${NRF7002DK_ROM} | ${NRF7002DK_RAM} |

          **File types:**
          - \`.hex\` — Full board image for initial provisioning via \`nrfutil device program\`
          - \`.signed.bin\` — OTA image for Memfault over-the-air update via MCUboot
          - \`.elf\` — Symbol file for Memfault crash decoding and coredump analysis

          > Terraforma-project builds are not yet available on the \`ncs264\` branch — see [nordic-wifi-memfault-terraforma](https://github.com/chshzh/nordic-wifi-memfault-terraforma) for the (currently NCS v3.x-only) Terraforma release flow.

          For flashing and connection instructions, see the [Evaluator Quick Start guide](https://github.com/chshzh/nordic-wifi-memfault/blob/ncs264/README.md#evaluator-quick-start) in the README.

          ### 📝 Changes Since Last Release

          EOF
          cat /tmp/changelog.txt >> /tmp/release-body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nordic Wi-Fi Memfault ${{ steps.ver.outputs.VERSION }}"
          tag_name: ${{ steps.ver.outputs.VERSION }}
          body_path: /tmp/release-body.txt
          generate_release_notes: false
          files: |
            release/**/*.elf
            release/**/*.bin
            release/**/*.hex
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
